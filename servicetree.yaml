service: razorpay-turbo-custom  # required, canonical slug — immutable once registered
displayName: "Razorpay Turbo Custom UI iOS SDK"  # required, human-readable name — built from the podspec, since the README is only the repo name: s.name "razorpay-turbo-custom", s.summary "CocoaPod implementation of Razorpay's Turbo in-app UPI Payments", and the two non-Core subspecs (headless, ui) both depending on razorpay-customui-pod, which is what makes this the Custom UI variant rather than the Standard one
description: "CocoaPods distribution of Razorpay's Turbo in-app UPI SDK for iOS merchants building their own payment UI — ships the RazorpayTurboUPI / TurboUpiPlugin frameworks as prebuilt vendored binaries in headless and pre-built-UI flavours on a shared Core (CommonLibrary, two_party, Sentry), with an Example app for integration testing."  # required, one-sentence description of what the service does — the repo README is a single title line, so grounded in razorpay-turbo-custom.podspec (v2.1.10, summary "CocoaPod implementation of Razorpay's Turbo in-app UPI Payments", iOS deployment target 12.0, Swift 5.0) and the repo tree: Pod/core (CommonLibrary.framework with the NPCI UPI assets and xml-signature.js, two_party.framework, Sentry.framework), Pod/headless (RazorpayTurboUPI.framework, TurboUpiPlugin.framework), Pod/ui (RazorpayTurboUPIUI.framework, TurboUpiPluginUI.framework) — both subspecs depending on razorpay-turbo-custom/Core and razorpay-customui-pod — plus Example/ with its own Podfile and xcworkspace. TO VERIFY: description reconstructed from the podspec and tree because the repo carries no README content and no design doc
type: library  # required, one of: service | worker | cron | library | pipeline — a CocoaPods pod: a .podspec plus vendored .framework binaries and a sample app, consumed by merchant iOS apps. There is no Dockerfile, helm chart, Spinnaker application or Netra deployment, and there is no first-party source in the repo at all — the frameworks are built elsewhere and committed here as release artefacts (which is why GitHub reports the language as Objective-C from the framework headers)
tier: T2  # required, one of: T0 | T1 | T2 | T3 — Payments Reliability sheet Priority P2 → T2; kept, and consistent with the other client SDKs in this batch. Turbo runs on the live UPI payment path inside merchant apps, but this repo is a distribution channel for prebuilt binaries with no runtime Razorpay operates; a bad version can only be remediated by publishing a new one and having merchants upgrade, which is a release-quality risk rather than an availability tier
lifecycle: live  # optional, one of: incubating | live | deprecated | retired — kept live: the pod is at v2.1.10, the repo was last pushed 2026-07-17, and there are live merchant integration channels against it (#zomato-razorpay-turbo_integration, #rzp-queepay-turbointegration, #rzp-iocl-turbointegration, #rzp-fisdom-turbointegration)

domain: payment-methods/upi  # required, two-level domain/subgroup slug — the Payments Reliability sheet has no BU for this repo and it carries no .github/repo_owners.json or CODEOWNERS, so derived from what it ships: the Turbo in-app UPI SDK. Family payment-methods and area upi reuse the slugs the merged payments-upi and frontend-upi-sdk manifests already use, and the owning team names itself UPI Experience in #upi-turbo (purpose "UPI Experience - UPI Turbo - In App UPI (P2M)"). TO VERIFY: ownership is inferred from the product rather than from a declared BU — the repo has no ownership file at all, which is itself worth fixing

