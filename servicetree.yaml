# Relationship to razorpay/razorpay-turbo-pod, which is easy to confuse with this repo: both are CocoaPods distributions of the same Turbo in-app UPI SDK, split by integration style. razorpay-turbo-pod publishes the pod "razorpay-turbo" (v2.1.7) with a 'standard' subspec that depends on razorpay-pod, i.e. Turbo on top of Standard Checkout; this repo publishes "razorpay-turbo-custom" (v2.1.10) with 'headless' and 'ui' subspecs that depend on razorpay-customui-pod, i.e. Turbo for merchants driving their own UI. The Android equivalents live in razorpay/razorpay-android (the :turbo module). Neither iOS repo holds source — both are release channels for frameworks built elsewhere, so a code-based owner or dependency scan will find nothing here.
